<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SONIFY - NextGen Web Player</title>

  <!-- Browser Tab Favicon -->

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Light Theme Base Colors */
      --bg-dark: #f1f5f9;                 /* Light slate background */
      --card-bg: rgba(255, 255, 255, 0.85); /* Semi-transparent white card */
      --card-border: rgba(0, 0, 0, 0.08);   /* Subtle light card borders */
      --card-border-glow: rgba(139, 92, 246, 0.2);
      --input-bg: rgba(241, 245, 249, 0.9);
      --input-border: rgba(0, 0, 0, 0.12);
      
      --accent-green: #10b981;
      --accent-green-glow: rgba(16, 185, 129, 0.2);
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      
      /* Dark Text Colors for Crisp Light Background Contrast */
      --text-main: #0f172a;               /* Dark Slate Text */
      --text-sub: #475569;                /* Medium Slate Subtext */
      --text-placeholder: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      position: relative;
    }

    /* Ambient Dynamic Glowing Background Orbs (Light Mode) */
    body::before, body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    body::before {
      top: -10%;
      left: 15%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.25), rgba(236, 72, 153, 0.25));
    }

    body::after {
      bottom: -10%;
      right: 15%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.2), rgba(16, 185, 129, 0.2));
    }

    /* BRAND HEADER */
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 980px;
      margin-bottom: 24px;
      width: 100%;
      position: relative;
      z-index: 1;
      gap: 16px;
    }

    .brand-logo-title {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-header svg {
      filter: drop-shadow(0 2px 8px rgba(236, 72, 153, 0.25));
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .brand-header svg:hover {
      transform: rotate(5deg) scale(1.05);
    }

    .brand-header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-container {
      display: flex;
      gap: 10px;
    }

    .network-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
      cursor: pointer;
      color: var(--text-sub);
    }

    .network-badge:hover {
      border-color: rgba(0, 0, 0, 0.2);
      transform: translateY(-1px);
    }

    .network-badge.online { color: #059669; border-color: rgba(16, 185, 129, 0.3); }
    .network-badge.offline { color: #dc2626; border-color: rgba(239, 68, 68, 0.3); }
    .network-badge.datasaver { color: #2563eb; border-color: rgba(37, 99, 235, 0.3); }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }

    .online .status-dot { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
    .offline .status-dot { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
    .datasaver .status-dot { background-color: #3b82f6; box-shadow: 0 0 8px #3b82f6; }

    /* LAYOUT CONTAINER */
    .app-container {
      width: 100%;
      max-width: 980px;
      display: grid;
      grid-template-columns: 410px 1fr;
      gap: 28px;
      justify-content: center;
      align-items: start;
      position: relative;
      z-index: 1;
    }

    /* PLAYER CARD */
    .player-card {
      position: sticky;
      top: 24px;
      z-index: 100;
      background-color: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      transition: border-color 0.4s ease;
      min-width: 0;
    }

    .player-card.playing {
      border-color: rgba(16, 185, 129, 0.4);
      box-shadow: 0 16px 40px rgba(16, 185, 129, 0.12), 0 0 20px rgba(16, 185, 129, 0.08);
    }

    .cover-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      overflow: hidden;
      background: #e2e8f0;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-container::before {
      content: "";
      position: absolute;
      inset: -10px;
      background-image: var(--bg-cover-url);
      background-size: cover;
      background-position: center;
      filter: blur(20px) brightness(0.85);
      z-index: 0;
      transition: all 0.5s ease;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      position: relative;
      z-index: 1;
      transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .player-card.playing .cover-img {
      transform: scale(1.03);
    }

    .like-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(0, 0, 0, 0.1);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      color: var(--text-sub);
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
      z-index: 2;
    }

    .like-btn:hover {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.95);
      color: var(--text-main);
    }

    .like-btn.liked {
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.3);
      background: rgba(254, 226, 226, 0.85);
      text-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
    }

    .track-info-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
    }

    .track-info {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .playback-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .playback-status-badge.playing {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.3);
      color: #059669;
    }

    .playback-status-badge.paused {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.3);
      color: #d97706;
    }

    .track-title {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      line-height: 1.3;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
      height: 2.6em;
    }

    .track-artist {
      font-size: 0.88rem;
      color: var(--text-sub);
      margin-top: 4px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* PROGRESS & RANGE SLIDERS */
    .progress-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .range-slider {
      width: 100%;
      height: 5px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 10px;
      outline: none;
      cursor: pointer;
      transition: height 0.2s ease;
    }

    .range-slider:hover {
      height: 7px;
    }

    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #0f172a;
      box-shadow: 0 0 8px rgba(0,0,0,0.25);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .progress-container:hover .range-slider::-webkit-slider-thumb,
    .volume-container:hover .range-slider::-webkit-slider-thumb {
      opacity: 1;
    }

    .range-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    /* PLAYER BUTTONS */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      width: 100%;
      margin: 4px 0;
    }

    .btn {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .btn-secondary {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.03);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      backdrop-filter: blur(8px);
    }

    .btn-secondary:hover {
      color: var(--text-main);
      background: rgba(0, 0, 0, 0.08);
      border-color: rgba(0, 0, 0, 0.15);
      transform: scale(1.05);
    }

    .btn-secondary:active {
      transform: scale(0.95);
    }

    .btn-secondary.active {
      color: #059669;
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.15);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
    }

    .btn-secondary svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .btn-play {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      color: #ffffff;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      font-size: 1.3rem;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
    }

    .btn-play:hover {
      transform: scale(1.06);
      box-shadow: 0 10px 24px rgba(16, 185, 129, 0.45);
    }

    .btn-play:active {
      transform: scale(0.95);
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      background: rgba(0, 0, 0, 0.03);
      padding: 8px 14px;
      border-radius: 16px;
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .volume-icon {
      font-size: 0.9rem;
      color: var(--text-sub);
      cursor: pointer;
      flex-shrink: 0;
      transition: color 0.2s;
    }

    .volume-icon:hover {
      color: var(--text-main);
    }

    .volume-percent {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-sub);
      min-width: 36px;
      text-align: right;
      flex-shrink: 0;
    }

    /* PLAYLIST SECTION */
    .playlist-wrapper {
      background-color: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      width: 100%;
      overflow: hidden;
      min-width: 0;
    }

    .search-input, 
    .playlist-select, 
    .sort-select {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input::placeholder {
      color: var(--text-placeholder);
    }

    .search-input:focus,
    .playlist-select:focus,
    .sort-select:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
      background: #ffffff;
    }

    .playlist-selector-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .playlist-select {
      font-weight: 600;
      flex: 1;
      cursor: pointer;
    }

    .playlist-select option,
    .sort-select option {
      background: #ffffff;
      color: var(--text-main);
    }

    .search-bar-container {
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 0.95rem;
    }

    .filter-bar {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .sort-select {
      cursor: pointer;
      flex: 1;
    }

    .playlist {
      position: relative;
      max-height: 440px;
      overflow-y: auto;
      width: 100%;
      will-change: transform;
      contain: layout paint;
      padding-right: 4px;
    }

    .playlist-viewport {
      position: relative;
      width: 100%;
    }

    .playlist::-webkit-scrollbar {
      width: 5px;
    }
    .playlist::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 10px;
    }

    .playlist-item {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 12px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(0, 0, 0, 0.04);
      cursor: pointer;
      height: 58px;
      transition: all 0.2s ease;
    }

    .playlist-item:hover {
      background: rgba(0, 0, 0, 0.05);
      border-color: rgba(0, 0, 0, 0.08);
      transform: translateY(-1px);
    }

    .playlist-item.active {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .playlist-item.active .playlist-song-title {
      color: #059669;
    }

    .playlist-thumb {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      background: #e2e8f0;
      display: block;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .playlist-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      overflow: hidden;
    }

    .playlist-song-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .playlist-song-artist {
      font-size: 0.76rem;
      color: var(--text-sub);
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .item-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.05rem;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .item-btn:hover {
      color: var(--text-main);
      background: rgba(0, 0, 0, 0.08);
    }

    .item-like-btn.liked {
      color: #ef4444;
    }

    .empty-msg {
      text-align: center;
      padding: 40px 10px;
      color: var(--text-sub);
      font-size: 0.88rem;
      font-weight: 500;
    }

    /* TOAST NOTIFICATIONS */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 3000;
      pointer-events: none;
      width: auto;
      max-width: 380px;
    }

    .toast {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--accent-purple);
      color: var(--text-main);
      padding: 12px 20px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.85rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1), 0 0 12px rgba(139, 92, 246, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(12px);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* MOBILE RESPONSIVENESS */
    @media (max-width: 820px) {
      body {
        padding: 16px 12px;
      }

      .brand-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .app-container {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .player-card,
      .playlist-wrapper {
        padding: 20px;
        border-radius: 22px;
      }

      .player-card {
        position: static;
      }

      .cover-container {
        max-width: 260px;
        margin: 0 auto;
      }

      .playlist {
        max-height: 360px;
      }

      .toast-container {
        bottom: 20px;
        right: 16px;
        left: 16px;
        max-width: none;
      }
    }
  </style>
</head>
<body>

  <header class="brand-header">
    <div class="brand-logo-title">
      <svg width="38" height="38" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sGrad" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ec4899"/>
            <stop offset="45%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#3b82f6"/>
          </linearGradient>
          <linearGradient id="wavePink" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f43f5e"/>
            <stop offset="100%" stop-color="#d946ef"/>
          </linearGradient>
          <linearGradient id="waveBlue" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#06b6d4"/>
            <stop offset="100%" stop-color="#3b82f6"/>
          </linearGradient>
        </defs>
        <rect x="12" y="52" width="5" height="16" rx="2.5" fill="url(#wavePink)"/>
        <rect x="21" y="44" width="5" height="32" rx="2.5" fill="url(#wavePink)"/>
        <rect x="30" y="34" width="5" height="52" rx="2.5" fill="url(#wavePink)"/>
        <rect x="39" y="42" width="5" height="36" rx="2.5" fill="url(#wavePink)"/>
        <rect x="76" y="42" width="5" height="36" rx="2.5" fill="url(#waveBlue)"/>
        <rect x="85" y="34" width="5" height="52" rx="2.5" fill="url(#waveBlue)"/>
        <rect x="94" y="44" width="5" height="32" rx="2.5" fill="url(#waveBlue)"/>
        <rect x="103" y="52" width="5" height="16" rx="2.5" fill="url(#waveBlue)"/>
        <path d="M 78,28 C 78,16 63,14 55,14 C 41,14 36,22 38,34 C 40,46 54,49 66,54 C 80,60 84,72 79,88 C 73,105 52,108 38,103 C 33,101 28,95 28,95 C 28,95 44,98 52,90 C 59,83 58,74 58,74 C 58,74 70,82 70,68 C 70,57 58,54 47,49 C 34,43 27,33 30,20 C 33,6 54,4 68,5 C 75,6 78,10 78,10 Z" fill="url(#sGrad)"/>
        <circle cx="47" cy="88" r="11" fill="url(#sGrad)"/>
      </svg>
      <h1>SONIFY</h1>
    </div>
    
    <div class="badge-container">
      <div id="network-badge" class="network-badge online">
        <span class="status-dot"></span>
        <span id="network-text">Online</span>
      </div>

      <div id="data-saver-btn" class="network-badge datasaver" title="Click to toggle Data Saver Mode">
        <span class="status-dot"></span>
        <span id="data-saver-text">Data Saver: ON</span>
      </div>
    </div>
  </header>

  <div class="app-container">
    <div class="player-card" id="player-card">
      <div class="cover-container">
        <img id="cover-img" class="cover-img" src="" alt="Album Cover" />
        <button class="like-btn" id="like-btn" title="Like Song">♥</button>
      </div>

      <div class="track-info-header">
        <div class="track-info">
          <div id="title" class="track-title">Loading...</div>
          <div id="artist" class="track-artist">Loading...</div>
        </div>
        <div id="playback-status" class="playback-status-badge paused">
          <span id="status-icon">⏸</span>
          <span id="status-text">Paused</span>
        </div>
      </div>

      <div class="progress-container">
        <input type="range" id="progress" class="range-slider" value="0" min="0" max="100" step="0.1" />
        <div class="time-stamps">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-secondary" id="shuffle" aria-label="Shuffle" title="Toggle Shuffle">
          <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>

        <button class="btn btn-secondary" id="prev" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <button class="btn btn-play" id="play" aria-label="Play/Pause">
          <span id="play-icon">▶</span>
        </button>

        <button class="btn btn-secondary" id="next" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6z"/></svg>
        </button>

        <button class="btn btn-secondary" id="repeat" aria-label="Repeat" title="Toggle Repeat">
          <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
      </div>

      <div class="volume-container">
        <span class="volume-icon" id="mute-btn">🔈</span>
        <input type="range" id="volume" class="range-slider" min="0" max="1" step="0.05" value="0.8" />
        <span class="volume-icon">🔊</span>
        <span class="volume-percent" id="volume-percent">80%</span>
      </div>
    </div>

    <div class="playlist-wrapper">
      <div class="search-bar-container">
        <input type="text" id="search-bar" class="search-input" placeholder="🔍 Search song or artist..." />
      </div>

      <div class="filter-bar">
        <select id="playlist-select" class="playlist-select">
          <option value="all">🎵 All Songs</option>
          <option value="fav">💚 Liked Songs</option>
        </select>
        <select id="sort-select" class="sort-select">
          <option value="default">Default</option>
          <option value="a-z">A - Z (Title)</option>
          <option value="z-a">Z - A (Title)</option>
          <option value="artist">Artist Name</option>
        </select>
      </div>

      <div class="playlist" id="playlist">
        <div class="playlist-viewport" id="playlist-viewport"></div>
      </div>
    </div>
  </div>

  <div class="toast-container">
    <div class="toast" id="toast">
      <span id="toast-icon">✨</span>
      <span id="toast-text">Message</span>
    </div>
  </div>

  <audio id="audio"></audio>

  <script src="songs.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      let refreshing = false;

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          reg.update();

          setInterval(() => {
            reg.update();
          }, 60000);

          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                newWorker.postMessage({ action: 'skipWaiting' });
              }
            });
          });
        }).catch((err) => {
          console.error('Service Worker Registration Failed:', err);
        });
      });
    }

    const DEFAULT_COVER = "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500&auto=format&fit=crop";

    const audio = document.getElementById('audio');
    const playerCard = document.getElementById('player-card');
    const playBtn = document.getElementById('play');
    const playIcon = document.getElementById('play-icon');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const shuffleBtn = document.getElementById('shuffle');
    const repeatBtn = document.getElementById('repeat');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');
    const coverContainer = document.querySelector('.cover-container');
    const coverImg = document.getElementById('cover-img');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const playlistEl = document.getElementById('playlist');
    const playlistViewport = document.getElementById('playlist-viewport');
    const likeBtn = document.getElementById('like-btn');
    const volumeSlider = document.getElementById('volume');
    const volumePercentEl = document.getElementById('volume-percent');
    const muteBtn = document.getElementById('mute-btn');
    const searchBar = document.getElementById('search-bar');
    const sortSelect = document.getElementById('sort-select');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');
    const toastIcon = document.getElementById('toast-icon');

    const networkBadge = document.getElementById('network-badge');
    const networkText = document.getElementById('network-text');
    const dataSaverBtn = document.getElementById('data-saver-btn');
    const dataSaverText = document.getElementById('data-saver-text');

    const playbackStatus = document.getElementById('playback-status');
    const statusIcon = document.getElementById('status-icon');
    const statusText = document.getElementById('status-text');

    const playlistSelect = document.getElementById('playlist-select');

    let currentSongIndex = 0;
    let isShuffle = false;
    let isRepeat = false;
    let isDataSaver = true;
    let lastVolume = 0.8;
    let toastTimeout = null;

    let searchDebounceTimer = null;

    const ITEM_HEIGHT = 66;
    const BUFFER_SIZE = 5;

    function updateNetworkStatus() {
      if (navigator.onLine) {
        networkBadge.className = "network-badge online";
        networkText.textContent = "Online";
      } else {
        networkBadge.className = "network-badge offline";
        networkText.textContent = "Offline Mode";
        showToast("⚡", "Switched to Offline Listening Mode");
      }
    }

    dataSaverBtn.addEventListener('click', () => {
      isDataSaver = !isDataSaver;
      if (isDataSaver) {
        dataSaverBtn.className = "network-badge datasaver";
        dataSaverText.textContent = "Data Saver: ON";
        showToast("📶", "Data Saver Enabled: Zero-data cached streaming active");
      } else {
        dataSaverBtn.className = "network-badge online";
        dataSaverText.textContent = "Data Saver: OFF";
        showToast("🌐", "Data Saver Disabled: Standard online mode active");
      }
    });

    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);

    function updateSliderFill(slider, percentage) {
      slider.style.background = `linear-gradient(to right, var(--accent-green) 0%, var(--accent-green) ${percentage}%, rgba(0, 0, 0, 0.08) ${percentage}%, rgba(0, 0, 0, 0.08) 100%)`;
    }

    function sanitizeImageUrl(url) {
      if (!url) return DEFAULT_COVER;
      url = url.trim();
      try {
        if (url.includes('google.com/imgres') || url.includes('google.com/url')) {
          const parsedUrl = new URL(url);
          const actualImgUrl = parsedUrl.searchParams.get('imgurl') || parsedUrl.searchParams.get('url');
          if (actualImgUrl) return decodeURIComponent(actualImgUrl);
        }
      } catch (e) {}
      return url;
    }

    coverImg.onerror = function() {
      this.onerror = null;
      this.src = DEFAULT_COVER;
      coverContainer.style.setProperty('--bg-cover-url', `url('${DEFAULT_COVER}')`);
    };

    function updatePlaybackStatusUI(isPlaying) {
      if (isPlaying) {
        playbackStatus.className = "playback-status-badge playing";
        statusIcon.textContent = "▶";
        statusText.textContent = "Playing";
      } else {
        playbackStatus.className = "playback-status-badge paused";
        statusIcon.textContent = "⏸";
        statusText.textContent = "Paused";
      }
    }

    function initPlayer() {
      updateNetworkStatus();
      renderPlaylistOptions();
      renderPlaylist();
      if (typeof songs !== 'undefined' && songs.length > 0) {
        loadSong(songs[currentSongIndex]);
      }
      audio.volume = volumeSlider.value;
      updateVolumeUI(volumeSlider.value);
      updateSliderFill(progress, 0);
      updatePlaybackStatusUI(false);
      
      setupMediaSessionHandlers();
    }

    function loadSong(song) {
      if (!song) return;
      const imgUrl = sanitizeImageUrl(song.imgSrc);

      title.textContent = song.title || "Unknown Title";
      artist.textContent = song.artist || "Unknown Artist";
      coverImg.src = imgUrl;

      coverContainer.style.setProperty('--bg-cover-url', `url('${imgUrl}')`);

      audio.src = song.src;
      progress.value = 0;
      updateSliderFill(progress, 0);
      updateLikeButtonState(song.isLiked);
      highlightPlaylistItem();

      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: song.title || "Unknown Title",
          artist: song.artist || "Unknown Artist",
          artwork: [
            { src: imgUrl, sizes: '96x96', type: 'image/png' },
            { src: imgUrl, sizes: '128x128', type: 'image/png' },
            { src: imgUrl, sizes: '192x192', type: 'image/png' },
            { src: imgUrl, sizes: '256x256', type: 'image/png' },
            { src: imgUrl, sizes: '384x384', type: 'image/png' },
            { src: imgUrl, sizes: '512x512', type: 'image/png' }
          ]
        });
      }
    }

    function setupMediaSessionHandlers() {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('play', () => playSong());
        navigator.mediaSession.setActionHandler('pause', () => pauseSong());
        navigator.mediaSession.setActionHandler('previoustrack', () => prevBtn.click());
        navigator.mediaSession.setActionHandler('nexttrack', () => nextBtn.click());
      }
    }

    function playSong() {
      audio.play().then(() => {
        if ('mediaSession' in navigator) {
          navigator.mediaSession.playbackState = "playing";
        }
      }).catch(e => {
        console.log('Playback error:', e);
      });
      playerCard.classList.add('playing');
      playIcon.textContent = '❚❚';
      updatePlaybackStatusUI(true);
    }

    function pauseSong() {
      audio.pause();
      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = "paused";
      }
      playerCard.classList.remove('playing');
      playIcon.textContent = '▶';
      updatePlaybackStatusUI(false);
    }

    playBtn.addEventListener('click', () => {
      audio.paused ? playSong() : pauseSong();
    });

    shuffleBtn.addEventListener('click', () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('active', isShuffle);
      
      if (isShuffle) {
        showToast("🔀", "Shuffle Mode Enabled");
      } else {
        showToast("🔁", "Sequential Mode Enabled");
      }
    });

    repeatBtn.addEventListener('click', () => {
      isRepeat = !isRepeat;
      repeatBtn.classList.toggle('active', isRepeat);
      audio.loop = isRepeat;
      
      if (isRepeat) {
        showToast("🔂", "Repeat Track Enabled");
      } else {
        showToast("➡️", "Repeat Disabled");
      }
    });

    prevBtn.addEventListener('click', () => {
      const currentList = getFilteredAndSortedList();
      if (currentList.length === 0) return;
      
      let idx = currentList.findIndex(s => s.id === songs[currentSongIndex].id);
      idx = (idx - 1 + currentList.length) % currentList.length;
      currentSongIndex = currentList[idx].id;

      loadSong(songs[currentSongIndex]);
      playSong();
    });

    nextBtn.addEventListener('click', () => {
      const currentList = getFilteredAndSortedList();
      if (currentList.length === 0) return;

      if (isShuffle) {
        let randomIndex;
        do {
          randomIndex = Math.floor(Math.random() * currentList.length);
        } while (currentList.length > 1 && currentList[randomIndex].id === songs[currentSongIndex].id);
        
        currentSongIndex = currentList[randomIndex].id;
      } else {
        let idx = currentList.findIndex(s => s.id === songs[currentSongIndex].id);
        idx = (idx + 1) % currentList.length;
        currentSongIndex = currentList[idx].id;
      }

      loadSong(songs[currentSongIndex]);
      playSong();
    });

    likeBtn.addEventListener('click', () => {
      toggleLikeSong(songs[currentSongIndex]);
    });

    function toggleLikeSong(song) {
      if (!song) return;
      song.isLiked = !song.isLiked;
      if (song.id === songs[currentSongIndex].id) {
        updateLikeButtonState(song.isLiked);
      }
      renderPlaylist();
      showToast(song.isLiked ? "❤️" : "🤍", song.isLiked ? `Added "${song.title}" to Liked Songs` : `Removed "${song.title}" from Liked Songs`);
    }

    function updateLikeButtonState(isLiked) {
      likeBtn.classList.toggle('liked', isLiked);
    }

    function renderPlaylistOptions() {
      const selected = playlistSelect.value;
      const validSongs = typeof songs !== 'undefined' ? songs.filter(s => s.title) : [];
      const totalSongs = validSongs.length;
      const likedSongs = validSongs.filter(s => s.isLiked).length;
      
      playlistSelect.innerHTML = `
        <option value="all">🎵 All Songs (${totalSongs})</option>
        <option value="fav">💚 Liked Songs (${likedSongs})</option>
      `;

      playlistSelect.value = selected || 'all';
    }

    playlistSelect.addEventListener('change', () => {
      playlistEl.scrollTop = 0;
      renderPlaylist();
    });

    function getFilteredAndSortedList() {
      if (typeof songs === 'undefined') return [];
      const view = playlistSelect.value;
      
      let list = songs.filter(s => s && s.title && s.title.trim() !== "");

      if (view === 'fav') {
        list = list.filter(s => s.isLiked);
      }

      const query = searchBar.value.toLowerCase().trim();
      if (query) {
        list = list.filter(song => 
          (song.title && song.title.toLowerCase().includes(query)) || 
          (song.artist && song.artist.toLowerCase().includes(query))
        );
      }

      const sortValue = sortSelect.value;
      if (sortValue !== 'default') {
        list = [...list];
        if (sortValue === 'a-z') list.sort((a, b) => a.title.localeCompare(b.title));
        else if (sortValue === 'z-a') list.sort((a, b) => b.title.localeCompare(a.title));
        else if (sortValue === 'artist') list.sort((a, b) => a.artist.localeCompare(b.artist));
      }

      return list;
    }

    searchBar.addEventListener('input', () => {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        playlistEl.scrollTop = 0;
        renderPlaylist();
      }, 150);
    });

    sortSelect.addEventListener('change', () => {
      playlistEl.scrollTop = 0;
      renderPlaylist();
    });

    function showToast(icon, message) {
      clearTimeout(toastTimeout);
      toastIcon.textContent = icon;
      toastText.textContent = message;
      toast.className = `toast show`;
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 2400);
    }

    function updateVolumeUI(val) {
      const percent = Math.round(val * 100);
      volumePercentEl.textContent = `${percent}%`;
      updateSliderFill(volumeSlider, percent);
    }

    volumeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      audio.volume = val;
      updateVolumeUI(val);
    });

    muteBtn.addEventListener('click', () => {
      if (audio.volume > 0) {
        lastVolume = audio.volume;
        audio.volume = 0;
        volumeSlider.value = 0;
      } else {
        audio.volume = lastVolume;
        volumeSlider.value = lastVolume;
      }
      updateVolumeUI(volumeSlider.value);
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const progressPercent = (audio.currentTime / audio.duration) * 100;
        progress.value = progressPercent;
        updateSliderFill(progress, progressPercent);
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
      }
    });

    progress.addEventListener('input', () => {
      if (audio.duration) {
        const targetTime = (progress.value / 100) * audio.duration;
        audio.currentTime = targetTime;
        updateSliderFill(progress, progress.value);
      }
    });

    audio.addEventListener('ended', () => {
      if (!isRepeat) {
        nextBtn.click();
      }
    });

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function renderPlaylist() {
      renderPlaylistOptions();
      const listToRender = getFilteredAndSortedList();
      playlistViewport.innerHTML = '';

      if (listToRender.length === 0) {
        playlistViewport.style.height = '0px';
        playlistViewport.innerHTML = `<div class="empty-msg">No songs found in this view</div>`;
        return;
      }

      const totalHeight = listToRender.length * ITEM_HEIGHT;
      playlistViewport.style.height = `${totalHeight}px`;

      const scrollTop = playlistEl.scrollTop;
      const clientHeight = playlistEl.clientHeight || 440;

      let startIndex = Math.floor(scrollTop / ITEM_HEIGHT) - BUFFER_SIZE;
      let endIndex = Math.ceil((scrollTop + clientHeight) / ITEM_HEIGHT) + BUFFER_SIZE;

      startIndex = Math.max(0, startIndex);
      endIndex = Math.min(listToRender.length, endIndex);

      const fragment = document.createDocumentFragment();

      for (let i = startIndex; i < endIndex; i++) {
        const song = listToRender[i];
        const item = document.createElement('div');
        item.className = `playlist-item ${typeof songs !== 'undefined' && song.id === songs[currentSongIndex]?.id ? 'active' : ''}`;
        item.dataset.id = song.id;
        item.style.transform = `translateY(${i * ITEM_HEIGHT}px)`;

        item.innerHTML = `
          <img src="${sanitizeImageUrl(song.imgSrc)}" class="playlist-thumb" alt="thumb" loading="lazy" onerror="this.onerror=null;this.src='${DEFAULT_COVER}';" />
          <div class="playlist-info">
            <div class="playlist-song-title">${song.title}</div>
            <div class="playlist-song-artist">${song.artist || 'Unknown Artist'}</div>
          </div>
          <div class="item-actions">
            <button class="item-btn item-like-btn ${song.isLiked ? 'liked' : ''}" data-like-id="${song.id}">♥</button>
          </div>
        `;

        fragment.appendChild(item);
      }

      playlistViewport.appendChild(fragment);
    }

    let isVirtualScrolling = false;
    playlistEl.addEventListener('scroll', () => {
      if (!isVirtualScrolling) {
        window.requestAnimationFrame(() => {
          renderPlaylist();
          isVirtualScrolling = false;
        });
        isVirtualScrolling = true;
      }
    });

    playlistEl.addEventListener('click', (e) => {
      const likeBtnClick = e.target.closest('[data-like-id]');
      if (likeBtnClick) {
        e.stopPropagation();
        toggleLikeSong(songs.find(s => s.id === parseInt(likeBtnClick.dataset.likeId)));
        return;
      }

      const itemClick = e.target.closest('.playlist-item');
      if (itemClick) {
        const clickedId = parseInt(itemClick.dataset.id);
        const targetIndex = songs.findIndex(s => s.id === clickedId);
        if (targetIndex !== -1) {
          currentSongIndex = targetIndex;
          loadSong(songs[currentSongIndex]);
          playSong();
        }
      }
    });

    function highlightPlaylistItem() {
      const items = playlistEl.querySelectorAll('.playlist-item');
      items.forEach((item) => {
        item.classList.toggle('active', typeof songs !== 'undefined' && parseInt(item.dataset.id) === songs[currentSongIndex]?.id);
      });
    }

    initPlayer();
  </script>
</body>
</html>
