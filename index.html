<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SONIFY</title>
  <style>
    :root {
      --spotify-black: #0d0d0d;
      --spotify-dark-gray: #181818;
      --spotify-card-bg: #222222;
      --spotify-card-hover: #2a2a2a;
      --spotify-border: rgba(255, 255, 255, 0.12);
      --spotify-green: #1db954;
      --spotify-green-hover: #1ed760;
      --spotify-text-main: #ffffff;
      --spotify-text-sub: #b3b3b3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Circular Std", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      background-color: var(--spotify-black);
      color: var(--spotify-text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 12px;
    }

    /* Site Header Title */
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
    }

    .brand-header svg {
      fill: var(--spotify-green);
      filter: drop-shadow(0 0 8px rgba(29, 185, 84, 0.4));
      flex-shrink: 0;
    }

    .brand-header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--spotify-text-main);
    }

    /* App Layout Container */
    .app-container {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      align-items: start;
    }

    /* Player Card Panel */
    .player-card {
      position: sticky;
      top: 20px;
      z-index: 100;
      background-color: var(--spotify-dark-gray);
      border: 1px solid var(--spotify-border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      overflow: hidden;
    }

    /* Album Cover Section */
    .cover-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      background: #282828;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .like-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.3rem;
      color: var(--spotify-text-sub);
      backdrop-filter: blur(6px);
      transition: all 0.2s ease;
    }

    .like-btn.liked {
      color: var(--spotify-green);
      border-color: var(--spotify-green);
    }

    /* Track Metadata */
    .track-info {
      width: 100%;
      overflow: hidden;
    }

    .track-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2; /* Added standard property to remove VS Code warning */
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .track-artist {
      font-size: 0.85rem;
      color: var(--spotify-text-sub);
      margin-top: 4px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progress Slider */
    .progress-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .range-slider {
      width: 100%;
      height: 5px;
      -webkit-appearance: none;
      appearance: none;
      background: linear-gradient(to right, var(--spotify-green) 0%, var(--spotify-green) 0%, #3e3e3e 0%, #3e3e3e 100%);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--spotify-text-main);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .progress-container:hover .range-slider::-webkit-slider-thumb,
    .volume-container:hover .range-slider::-webkit-slider-thumb {
      opacity: 1;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--spotify-text-sub);
    }

    /* Controls Section */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
    }

    .btn {
      background: none;
      border: none;
      color: var(--spotify-text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      color: var(--spotify-text-main);
    }

    .btn-secondary {
      width: 36px;
      height: 36px;
    }

    .btn-play {
      background-color: var(--spotify-green);
      color: var(--spotify-black);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.1rem;
      box-shadow: 0 6px 18px rgba(29, 185, 84, 0.35);
    }

    .btn-play:hover {
      background-color: var(--spotify-green-hover);
      scale: 1.05;
    }

    /* Volume Container */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .volume-icon {
      font-size: 0.85rem;
      color: var(--spotify-text-sub);
      cursor: pointer;
      flex-shrink: 0;
    }

    .volume-percent {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--spotify-text-sub);
      min-width: 32px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Playlist Section */
    .playlist-wrapper {
      background-color: var(--spotify-dark-gray);
      border: 1px solid var(--spotify-border);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8);
      width: 100%;
      overflow: hidden;
    }

    .tab-header {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--spotify-border);
      padding-bottom: 12px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--spotify-text-sub);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 20px;
    }

    .tab-btn.active {
      background: var(--spotify-text-main);
      color: var(--spotify-black);
      border-color: var(--spotify-text-main);
    }

    /* Search & Filter Controls Bar */
    .filter-bar {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      background: var(--spotify-card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--spotify-text-main);
      font-size: 0.85rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--spotify-green);
    }

    .sort-select {
      background: var(--spotify-card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--spotify-text-main);
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      flex-shrink: 0;
    }

    .sort-select option {
      background: #181818;
      color: #fff;
    }

    /* Playlist Items List */
    .playlist {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 440px;
      overflow-y: auto;
      width: 100%;
    }

    .playlist::-webkit-scrollbar {
      width: 5px;
    }
    .playlist::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--spotify-card-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      width: 100%;
      overflow: hidden;
    }

    .playlist-item:hover {
      background: var(--spotify-card-hover);
    }

    .playlist-item.active {
      background: rgba(29, 185, 84, 0.12);
      border: 1px solid rgba(29, 185, 84, 0.4);
    }

    .playlist-item.active .playlist-song-title {
      color: var(--spotify-green);
    }

    .playlist-thumb {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .playlist-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .playlist-song-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--spotify-text-main);
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2; /* Added standard property to remove VS Code warning */
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .playlist-song-artist {
      font-size: 0.78rem;
      color: var(--spotify-text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-like-btn {
      background: none;
      border: none;
      color: var(--spotify-text-sub);
      font-size: 1.45rem;
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .item-like-btn:hover {
      color: var(--spotify-text-main);
      transform: scale(1.2);
      background: rgba(255, 255, 255, 0.08);
    }

    .item-like-btn.liked {
      color: var(--spotify-green);
    }

    .empty-msg {
      text-align: center;
      padding: 30px 10px;
      color: var(--spotify-text-sub);
      font-size: 0.85rem;
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      pointer-events: none;
      width: 90%;
      max-width: 320px;
    }

    .toast {
      background: #282828;
      border: 1px solid var(--spotify-border);
      color: var(--spotify-text-main);
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.82rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Mobile Responsive Breakpoint */
    @media (max-width: 768px) {
      body {
        padding: 12px 8px;
      }

      .app-container {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .player-card,
      .playlist-wrapper {
        padding: 14px;
        border-radius: 12px;
      }

      .player-card {
        position: static;
      }

      .cover-container {
        max-width: 280px;
        margin: 0 auto;
      }

      .filter-bar {
        flex-direction: row;
      }

      .playlist {
        max-height: 360px;
      }
    }

    @media (max-width: 420px) {
      .filter-bar {
        flex-direction: column;
      }
      
      .sort-select {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Brand Header -->
  <header class="brand-header">
    <svg width="32" height="32" viewBox="0 0 24 24">
      <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.48.66.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141 C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.18-1.38-.72-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.72 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
    </svg>
    <h1>Sonify</h1>
  </header>

  <div class="app-container">
    <!-- Player Card Panel -->
    <div class="player-card" id="player-card">
      <div class="cover-container">
        <img id="cover-img" class="cover-img" src="" alt="Album Cover" />
        <button class="like-btn" id="like-btn" title="Like Song">♥</button>
      </div>

      <div class="track-info">
        <div id="title" class="track-title">Loading...</div>
        <div id="artist" class="track-artist">Loading...</div>
      </div>

      <div class="progress-container">
        <input type="range" id="progress" class="range-slider" value="0" min="0" max="100" step="0.1" />
        <div class="time-stamps">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-secondary" id="prev" aria-label="Previous">
          <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <button class="btn btn-play" id="play" aria-label="Play/Pause">
          <span id="play-icon">▶</span>
        </button>

        <button class="btn btn-secondary" id="next" aria-label="Next">
          <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12h-2zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <!-- Volume Bar with Percentage -->
      <div class="volume-container">
        <span class="volume-icon" id="mute-btn">🔈</span>
        <input type="range" id="volume" class="range-slider" min="0" max="1" step="0.05" value="0.8" />
        <span class="volume-icon">🔊</span>
        <span class="volume-percent" id="volume-percent">80%</span>
      </div>
    </div>

    <!-- Playlist Section -->
    <div class="playlist-wrapper">
      <div class="tab-header">
        <button class="tab-btn active" id="tab-all">All Songs (<span id="all-count">0</span>)</button>
        <button class="tab-btn" id="tab-fav">Liked Songs (<span id="fav-count">0</span>)</button>
      </div>

      <!-- Search & Sort Filter Bar -->
      <div class="filter-bar">
        <input type="text" id="search-bar" class="search-input" placeholder="🔍 Search song or artist..." />
        <select id="sort-select" class="sort-select">
          <option value="default">Default</option>
          <option value="a-z">A - Z (Title)</option>
          <option value="z-a">Z - A (Title)</option>
          <option value="artist">Artist Name</option>
        </select>
      </div>

      <div class="playlist" id="playlist"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container">
    <div class="toast" id="toast">
      <span id="toast-icon">💚</span>
      <span id="toast-text">Message</span>
    </div>
  </div>

  <audio id="audio"></audio>

  <!-- Load Song Config Script First -->
  <script src="songs.js"></script>

  <!-- Player Script Logic -->
  <script>
    const DEFAULT_COVER = "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500&auto=format&fit=crop";

    const audio = document.getElementById('audio');
    const playerCard = document.getElementById('player-card');
    const playBtn = document.getElementById('play');
    const playIcon = document.getElementById('play-icon');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');
    const coverImg = document.getElementById('cover-img');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const playlistEl = document.getElementById('playlist');
    const likeBtn = document.getElementById('like-btn');
    const volumeSlider = document.getElementById('volume');
    const volumePercentEl = document.getElementById('volume-percent');
    const muteBtn = document.getElementById('mute-btn');
    const searchBar = document.getElementById('search-bar');
    const sortSelect = document.getElementById('sort-select');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');
    const toastIcon = document.getElementById('toast-icon');

    const tabAll = document.getElementById('tab-all');
    const tabFav = document.getElementById('tab-fav');
    const allCount = document.getElementById('all-count');
    const favCount = document.getElementById('fav-count');

    let currentSongIndex = 0;
    let activeTab = 'all';
    let lastVolume = 0.8;
    let toastTimeout = null;

    function updateSliderFill(slider, percentage) {
      slider.style.background = `linear-gradient(to right, var(--spotify-green) 0%, var(--spotify-green) ${percentage}%, #3e3e3e ${percentage}%, #3e3e3e 100%)`;
    }

    function sanitizeImageUrl(url) {
      if (!url) return DEFAULT_COVER;
      url = url.trim();

      try {
        if (url.includes('google.com/imgres') || url.includes('google.com/url')) {
          const parsedUrl = new URL(url);
          const actualImgUrl = parsedUrl.searchParams.get('imgurl') || parsedUrl.searchParams.get('url');
          if (actualImgUrl) return decodeURIComponent(actualImgUrl);
        }
      } catch (e) {
        // Fallthrough
      }

      return url;
    }

    coverImg.onerror = function() {
      this.onerror = null;
      this.src = DEFAULT_COVER;
    };

    function initPlayer() {
      allCount.textContent = songs.length;
      updateFavCount();
      renderPlaylist();
      loadSong(songs[currentSongIndex]);
      audio.volume = volumeSlider.value;
      updateVolumeUI(volumeSlider.value);
      updateSliderFill(progress, 0);
    }

    function loadSong(song) {
      if (!song) return;
      title.textContent = song.title;
      artist.textContent = song.artist;
      coverImg.src = sanitizeImageUrl(song.imgSrc);
      audio.src = song.src;
      progress.value = 0;
      updateSliderFill(progress, 0);
      updateLikeButtonState(song.isLiked);
      highlightPlaylistItem();
    }

    function playSong() {
      audio.play();
      playerCard.classList.add('playing');
      playIcon.textContent = '❚❚';
    }

    function pauseSong() {
      audio.pause();
      playerCard.classList.remove('playing');
      playIcon.textContent = '▶';
    }

    playBtn.addEventListener('click', () => {
      const isPlaying = !audio.paused;
      isPlaying ? pauseSong() : playSong();
    });

    prevBtn.addEventListener('click', () => {
      const currentList = getFilteredAndSortedList();
      if (currentList.length === 0) return;
      let idx = currentList.findIndex(s => s.id === songs[currentSongIndex].id);
      idx = (idx - 1 + currentList.length) % currentList.length;
      currentSongIndex = currentList[idx].id;
      loadSong(songs[currentSongIndex]);
      playSong();
    });

    nextBtn.addEventListener('click', () => {
      const currentList = getFilteredAndSortedList();
      if (currentList.length === 0) return;
      let idx = currentList.findIndex(s => s.id === songs[currentSongIndex].id);
      idx = (idx + 1) % currentList.length;
      currentSongIndex = currentList[idx].id;
      loadSong(songs[currentSongIndex]);
      playSong();
    });

    likeBtn.addEventListener('click', () => {
      toggleLikeSong(songs[currentSongIndex]);
    });

    function toggleLikeSong(song) {
      song.isLiked = !song.isLiked;

      if (song.id === songs[currentSongIndex].id) {
        updateLikeButtonState(song.isLiked);
      }

      updateFavCount();
      renderPlaylist();

      if (song.isLiked) {
        showToast("💚", `Added "${song.title}" to Liked Songs`);
      } else {
        showToast("🤍", `Removed "${song.title}" from Liked Songs`);
      }
    }

    function updateLikeButtonState(isLiked) {
      if (isLiked) {
        likeBtn.classList.add('liked');
      } else {
        likeBtn.classList.remove('liked');
      }
    }

    function updateFavCount() {
      const count = songs.filter(s => s.isLiked).length;
      favCount.textContent = count;
    }

    /* Search & Filter Sorting Logic */
    function getFilteredAndSortedList() {
      let list = activeTab === 'all' ? [...songs] : songs.filter(s => s.isLiked);

      // 1. Search Query Filter
      const query = searchBar.value.toLowerCase().trim();
      if (query) {
        list = list.filter(song => 
          song.title.toLowerCase().includes(query) || 
          song.artist.toLowerCase().includes(query)
        );
      }

      // 2. Dropdown Sort
      const sortValue = sortSelect.value;
      if (sortValue === 'a-z') {
        list.sort((a, b) => a.title.localeCompare(b.title));
      } else if (sortValue === 'z-a') {
        list.sort((a, b) => b.title.localeCompare(a.title));
      } else if (sortValue === 'artist') {
        list.sort((a, b) => a.artist.localeCompare(b.artist));
      }

      return list;
    }

    searchBar.addEventListener('input', renderPlaylist);
    sortSelect.addEventListener('change', renderPlaylist);

    tabAll.addEventListener('click', () => {
      activeTab = 'all';
      tabAll.classList.add('active');
      tabFav.classList.remove('active');
      renderPlaylist();
    });

    tabFav.addEventListener('click', () => {
      activeTab = 'fav';
      tabFav.classList.add('active');
      tabAll.classList.remove('active');
      renderPlaylist();
    });

    function showToast(icon, message) {
      clearTimeout(toastTimeout);
      toastIcon.textContent = icon;
      toastText.textContent = message;

      toast.className = `toast show`;

      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2400);
    }

    /* Volume Updates */
    function updateVolumeUI(val) {
      const percent = Math.round(val * 100);
      volumePercentEl.textContent = `${percent}%`;
      updateSliderFill(volumeSlider, percent);
    }

    volumeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      audio.volume = val;
      updateVolumeUI(val);
    });

    muteBtn.addEventListener('click', () => {
      if (audio.volume > 0) {
        lastVolume = audio.volume;
        audio.volume = 0;
        volumeSlider.value = 0;
      } else {
        audio.volume = lastVolume;
        volumeSlider.value = lastVolume;
      }
      updateVolumeUI(volumeSlider.value);
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const progressPercent = (audio.currentTime / audio.duration) * 100;
        progress.value = progressPercent;
        updateSliderFill(progress, progressPercent);
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
      }
    });

    progress.addEventListener('input', () => {
      if (audio.duration) {
        const targetTime = (progress.value / 100) * audio.duration;
        audio.currentTime = targetTime;
        updateSliderFill(progress, progress.value);
      }
    });

    audio.addEventListener('ended', () => {
      nextBtn.click();
    });

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function renderPlaylist() {
      const listToRender = getFilteredAndSortedList();
      playlistEl.innerHTML = '';

      if (listToRender.length === 0) {
        playlistEl.innerHTML = `<div class="empty-msg">No matching songs found</div>`;
        return;
      }

      const fragment = document.createDocumentFragment();

      listToRender.forEach((song) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${song.id === songs[currentSongIndex].id ? 'active' : ''}`;
        item.dataset.id = song.id;

        const cleanImgSrc = sanitizeImageUrl(song.imgSrc);

        item.innerHTML = `
          <img src="${cleanImgSrc}" class="playlist-thumb" alt="thumb" loading="lazy" onerror="this.onerror=null;this.src='${DEFAULT_COVER}';" />
          <div class="playlist-info">
            <div class="playlist-song-title">${song.title}</div>
            <div class="playlist-song-artist">${song.artist}</div>
          </div>
          <button class="item-like-btn ${song.isLiked ? 'liked' : ''}" data-like-id="${song.id}">♥</button>
        `;

        fragment.appendChild(item);
      });

      playlistEl.appendChild(fragment);
    }

    playlistEl.addEventListener('click', (e) => {
      const likeBtnClick = e.target.closest('[data-like-id]');
      if (likeBtnClick) {
        e.stopPropagation();
        const id = parseInt(likeBtnClick.dataset.likeId);
        toggleLikeSong(songs[id]);
        return;
      }

      const itemClick = e.target.closest('.playlist-item');
      if (itemClick) {
        const id = parseInt(itemClick.dataset.id);
        currentSongIndex = id;
        loadSong(songs[currentSongIndex]);
        playSong();
      }
    });

    function highlightPlaylistItem() {
      const items = playlistEl.querySelectorAll('.playlist-item');
      items.forEach((item) => {
        if (parseInt(item.dataset.id) === songs[currentSongIndex].id) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }

    initPlayer();
  </script>
</body>
</html>
